<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F5F0E8"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Fondo redondeado crema -->
  <rect x="40.96" y="40.96" width="942.08" height="942.08"
        rx="225.28" ry="225.28" fill="url(#bgGrad)"/>

  <!-- Grupo ícono (centrado un poco arriba) -->
  <g transform="translate(512, 450.56)">
    <!-- Sombra círculo dorado -->
    <circle cx="0" cy="10" r="374.64" fill="rgba(0,0,0,0.15)"/>
    <!-- Círculo dorado exterior -->
    <circle cx="0" cy="0" r="368.64" fill="#C9A84C" filter="url(#shadow)"/>
    <!-- Círculo crema interior -->
    <circle cx="0" cy="0" r="280.1664" fill="#F5F0E8"/>
    <!-- Letra M -->
    <text x="0" y="92.89728"
          font-family="Georgia, serif" font-size="258.048" font-weight="700"
          font-style="italic" fill="#C9A84C" text-anchor="middle"
          dominant-baseline="middle">M</text>
    <!-- Puntos decorativos -->
    <circle cx="-14" cy="384.64" r="5"  fill="#E2C97E" opacity="0.7"/>
    <circle cx="0"   cy="384.64" r="7"  fill="#C9A84C"/>
    <circle cx="14"  cy="384.64" r="5"  fill="#E2C97E" opacity="0.7"/>
  </g>

  <!-- Texto MADY -->
  <text x="512" y="921.6"
        font-family="Georgia, serif" font-size="133.12" font-weight="800"
        fill="#1A1A1A" text-anchor="middle" letter-spacing="16.384">MADY</text>
</svg>